services:
  aya-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aya-ryc-bot-docker
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3000"
    restart: unless-stopped
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aya-network

networks:
  aya-network:
    driver: bridge
