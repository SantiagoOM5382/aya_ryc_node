version: '3.8'

services:
  aya-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aya-ryc-bot-docker
    environment:
      - NODE_ENV=production
      - TYT_SERVICE_ENVIRONMENT=integration
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    ports:
      - "3001:3000"
    volumes:
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aya-network

networks:
  aya-network:
    driver: bridge
